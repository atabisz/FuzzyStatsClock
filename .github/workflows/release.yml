name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: REL-03 guard — LibreHardwareMonitor absent from FuzzyClock.Core/
        shell: bash
        run: |
          if grep -rn --include='*.cs' --include='*.csproj' 'LibreHardwareMonitor' FuzzyClock.Core/; then
            echo "::error::REL-03 violation: 'LibreHardwareMonitor' found in FuzzyClock.Core/"
            exit 1
          fi

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          IFS='.' read -ra PARTS <<< "$TAG"
          MAJOR="${PARTS[0]:-0}"
          MINOR="${PARTS[1]:-0}"
          PATCH="${PARTS[2]:-0}"
          echo "version=$MAJOR.$MINOR.$PATCH" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore -r win-x64 -p:PublishReadyToRun=true

      - name: Test
        run: dotnet test --no-restore --configuration Release

      - name: Publish
        run: >
          dotnet publish FuzzyClock.App
          -r win-x64
          -c Release
          --no-restore
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishReadyToRun=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.version }}
          -p:AssemblyVersion=${{ steps.version.outputs.version }}.0
          -p:FileVersion=${{ steps.version.outputs.version }}.0
          -o publish/

      - name: REL-02 guard — no WinRing0 driver in publish output
        shell: bash
        run: |
          if find publish/ -name 'WinRing0*.sys' -print -quit | grep -q .; then
            echo "::error::REL-02 violation: WinRing0*.sys leaked into publish/"
            find publish/ -name 'WinRing0*.sys'
            exit 1
          fi

      - name: Compile installer
        shell: cmd
        run: >
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          /DAppVersion=${{ steps.version.outputs.version }}
          /DSourceDir=publish
          FuzzyClock.iss

      - name: Rename EXE artifact
        shell: bash
        run: mv publish/FuzzyClock.exe "publish/FuzzyClock-${{ steps.version.outputs.version }}.exe"

      - name: Zip EXE artifacts
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          Compress-Archive -Path "publish/FuzzyClock-$ver.exe"          -DestinationPath "publish/FuzzyClock-$ver.zip"
          Compress-Archive -Path "installer/FuzzyClockSetup-$ver.exe"   -DestinationPath "installer/FuzzyClockSetup-$ver.zip"

      - name: Generate checksums
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          $portable  = "publish/FuzzyClock-$ver.zip"
          $installer = "installer/FuzzyClockSetup-$ver.zip"
          $h1 = (Get-FileHash $portable  -Algorithm SHA256).Hash
          $h2 = (Get-FileHash $installer -Algorithm SHA256).Hash
          "SHA256 (FuzzyClock-$ver.zip) = $h1" | Out-File -FilePath checksums.txt -Encoding utf8
          "SHA256 (FuzzyClockSetup-$ver.zip) = $h2" | Out-File -FilePath checksums.txt -Append -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            publish/FuzzyClock-${{ steps.version.outputs.version }}.zip
            installer/FuzzyClockSetup-${{ steps.version.outputs.version }}.zip
            checksums.txt
