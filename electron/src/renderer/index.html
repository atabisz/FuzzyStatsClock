<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      CSP with no `unsafe-inline` and no remote origins. The renderer loads one local
      bundle and never fetches anything, so the strictest policy that works is the
      right one — and an overlay that is always on top is a poor place to leave script
      injection open.

      `style-src 'self'` is what makes `index.css` legal and inline `style` attributes
      not. Every colour in this file is therefore a PRESENTATION ATTRIBUTE, never a CSS
      custom property, and the dial hands rotate via the SVG `transform` attribute
      rather than `element.style.transform`. See `theme.ts` for that decision.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:"
    />
    <title>FuzzyClock</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <!--
      The display, as SVG. Mirrors `FuzzyClock.App/MainWindow.xaml` element for element.

      ## This file carries ids and defaults. It does NOT carry geometry.

      `MainWindow.xaml` is `SizeToContent="WidthAndHeight"` with every row `Height="Auto"`,
      so WPF derives the whole layout from the content. SVG has no layout engine, so
      `core/layout.ts` computes it and `renderer.ts` writes every `x`, `y`, `width`,
      `height`, `transform` and `font-size` below from `windowLayout()`,
      `windowPlacement()` and `statsLayout()`. A number authored here would be a second
      copy of one of those, and the previous revision of this file held five of them
      (per-row `y` 108/126/144/162/180) which is exactly what `STATS_TRACK_WIDTH` was
      extracted to stop.

      Four authored constants survive, because no code path writes them: the hand
      lengths, the tick stroke width and the panel corner radius. `renderer-ids.test.ts`
      asserts each against the module constant it mirrors, so they are checked rather
      than trusted.

      ## The id set is a closed contract

      Exactly 46 ids, and `renderer-ids.test.ts` asserts the set here equals the union of
      `display-colors.ts`'s five id sets plus `NIXIE_GLYPH_IDS` and
      `NIXIE_COLON_GRADIENT_ID` from `nixie-face.ts`. Adding an element without adding it
      there — or the reverse — is a failing test, which matters because a `<use>` whose
      target is missing renders nothing at all with no error anywhere.

      ## Two inherited defaults on `#root`, and why they are safe

      `font-family` and `fill` are set once on `#root` and inherit down. A presentation
      attribute on the element ITSELF beats an inherited one, so `#phrase`/`#qualifier`/
      `#emphasis`/`#date` override the family (the phrase faces write `fontStackFor()`)
      and `applyTheme()` overrides the fill on its 26 targets. What inherits is the
      leftovers: the dial's hour numbers, which WPF also leaves at `Segoe UI Light`/White.

      **`index.css` must never declare `fill` or `font-family`** — a CSS declaration beats
      a presentation attribute, so a stylesheet rule on `text` would defeat both the
      theme and the font stack. Same trap as `.nixieGlow`'s stroke width.
    -->
    <svg
      id="root"
      xmlns="http://www.w3.org/2000/svg"
      width="232"
      height="260"
      viewBox="0 0 232 260"
      font-family='"Segoe UI Light", "Segoe UI", "Helvetica Neue", "DejaVu Sans", sans-serif'
      fill="white"
    >
      <defs>
        <!--
          `PhraseText`, `EmphasisText` and `DateText` each carry
          `DropShadowEffect BlurRadius=4 Direction=315 ShadowDepth=1 Opacity=0.6`.
          `QualifierText` does NOT — verified by reading MainWindow.xaml:79-85, not
          assumed from symmetry — so the filter is referenced by three elements below.
        -->
        <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0.7" dy="0.7" stdDeviation="1.6" flood-color="black" flood-opacity="0.6" />
        </filter>

        <!--
          One lit-cathode template per Nixie tube. `d` and `transform` are written on
          tick; the four `<use>` elements per tube inherit `stroke`/`stroke-width` from
          themselves. These have to be in `<defs>`: a `<use>` renders nothing when its
          target has `display: none`, so hiding a template that way is not available.
        -->
        <path id="nixieGlyph0" />
        <path id="nixieGlyph1" />
        <path id="nixieGlyph2" />
        <path id="nixieGlyph3" />

        <!--
          The Nixie colon dots' fill, and a recorded divergence. WPF's stops are
          `#A0FF8C00` at 0 and the literal `Transparent` at 1 — transparent *white* —
          interpolated non-premultiplied, which washes the mid-radius toward grey. SVG
          interpolates premultiplied, so the faithful endpoint alphas are kept and the
          hue is held at orange throughout. 0.627451 is 0xA0/255.
        -->
        <radialGradient id="nixieColonGlow">
          <stop offset="0" stop-color="#FF8C00" stop-opacity="0.627451" />
          <stop offset="1" stop-color="#FF8C00" stop-opacity="0" />
        </radialGradient>
      </defs>

      <!--
        The black panel, and it covers the WHOLE window including the 12px padding.
        This is the unnamed `<Border Background="Black" CornerRadius="5"
        IsHitTestVisible="False"/>` at MainWindow.xaml:27-29, a direct child of the root
        Grid rather than of the padded one. `rx` mirrors `CORNER_RADIUS`.

        WPF's root Grid also needs a `#01000000` background to stay hit-testable for
        right-clicks. The port needs no element for that: `renderer.ts` binds drag and
        contextmenu to `document`, which already covers the transparent padding.
      -->
      <rect id="windowBackground" x="0" y="0" rx="5" fill="black" />

      <!--
        `BackdropBorder` (MainWindow.xaml:31-37). Covers the whole window like the rect
        above it, authored transparent, painted `#000000aa`-ish on hover by
        `core/backdrop.ts`. Its ORDER matters and is why it is authored here rather than
        appended: the C# puts it above the permanent black Border and below the padded
        content, and `test/renderer-ids.test.ts` pins that position.

        TWO REASONS IT CANNOT CHANGE A PIXEL, both measured rather than assumed:

          1. The element under it is opaque black over the whole window, and the window's
             own opacity is group opacity applied above both. Compositing black at alpha
             `a` over opaque black is identically opaque black -- `out_a = a + 1(1-a) = 1`,
             `out_rgb = 0` -- so the WPF original has the same dead layer, for the same
             reason. The port reproduces it rather than diverging.
          2. `BackdropAlwaysVisible` and `BackdropOpacityPercent` are declared in
             `AppSettings.cs:46-47` and referenced NOWHERE else in `FuzzyClock.App`:
             `LoadSettings` never reads them, `SaveSettings` never writes them, and
             `ResetToDefaults` is the only caller of `ApplyBackdropState`. The original
             runs at a hardcoded `false`/`35`.

        It ships because the phase's exit bar names it and because `core/hover.ts` decides
        it, so leaving the element out would make that decision unreachable. What must not
        be claimed is that anything visible follows from painting it.
      -->
      <rect id="backdrop" x="0" y="0" rx="5" fill="transparent" />

      <!-- `ContentBorder` (row 0). Transparent and invisible; the id exists because
           Phase 8's auto-contrast is the thing that will paint it. -->
      <rect id="contentBackground" fill="transparent" />

      <!--
        The five faces, mutually exclusive, all authored hidden. `renderer.ts` calls
        `activate()` on every one of them with `face === active` on each settings push,
        so there is no first-run asymmetry to remember.
      -->
      <g id="phraseFace" display="none">
        <text id="phrase" text-anchor="middle" filter="url(#textShadow)"></text>
      </g>

      <g id="splitFace" display="none">
        <text id="qualifier" text-anchor="middle" dominant-baseline="text-before-edge" fill="#8CFFFFFF"></text>
        <text
          id="emphasis"
          text-anchor="middle"
          dominant-baseline="text-before-edge"
          filter="url(#textShadow)"
        ></text>
      </g>

      <!--
        Hands FIRST, decorations after — that is the WPF paint order, not a stylistic
        choice. `DialCanvas` declares the two `Line`s in markup and
        `InitDialDecorations` *appends* the ticks, dots and numbers at
        `ContentRendered`, so the decorations paint on top.

        The hands' authored `y2` IS their length (`dial-face.ts` writes only
        `transform`): 40 − HOUR_HAND_LENGTH and 40 − MINUTE_HAND_LENGTH. Round caps and
        `stroke-width=2` come from the XAML. The ticks deliberately have NO line caps —
        `InitDialDecorations` sets none, so they are flat where the hands are round —
        and their 1.5 mirrors TICK_STROKE_WIDTH, inherited by all twelve children
        because `dial-face.ts` writes no stroke width on them.
      -->
      <g id="dialFace" display="none">
        <line id="hourHand" x1="40" y1="40" x2="40" y2="15" stroke="white" stroke-width="2" stroke-linecap="round" />
        <line id="minuteHand" x1="40" y1="40" x2="40" y2="5" stroke="white" stroke-width="2" stroke-linecap="round" />
        <g id="hourTicks" stroke="white" stroke-width="1.5"></g>
        <g id="minuteDots"></g>
        <g id="hourNumbers"></g>
      </g>

      <g id="lcdFace" display="none"></g>
      <g id="nixieFace" display="none"></g>

      <!-- `DateText`. Same shadow as the phrase, by locked decision recorded in the XAML. -->
      <text id="date" text-anchor="middle" dominant-baseline="text-before-edge" filter="url(#textShadow)"></text>

      <!--
        `StatsPanel`: 184 wide, five rows of label / track / bar / percentage, then the
        uptime line and the update line. Ships `Collapsed` and `statsVisible` defaults
        false, so it is authored hidden.

        Children are positioned in PANEL-LOCAL coordinates — the `<g>` carries
        `windowPlacement().stats` as a transform — which is why Phase 6's per-row
        visibility only has to re-run `statsLayout()`.

        No temps line, and there will not be one: Option C, Alex's call. WPF's
        `TempsText` ships Visible with empty text and so still measures a full 16.63px
        line, which is the whole difference between the port's 106.43 panel and WPF's
        123.06.

        `BattText` uses `HorizontalAlignment="Right"` where the other four use
        `TextAlignment="Right"`; the arrange fixture proves all five right edges land on
        227.63, so one `text-anchor="end"` is correct for all five.
      -->
      <g id="stats" display="none">
        <text id="cpuLabel" dominant-baseline="text-before-edge">CPU</text>
        <rect id="cpuTrack" rx="2" fill="#40FFFFFF" />
        <rect id="cpuBar" width="0" rx="2" />
        <text id="cpuText" text-anchor="end" dominant-baseline="text-before-edge">0%</text>

        <text id="gpuLabel" dominant-baseline="text-before-edge">GPU</text>
        <rect id="gpuTrack" rx="2" fill="#40FFFFFF" />
        <rect id="gpuBar" width="0" rx="2" />
        <text id="gpuText" text-anchor="end" dominant-baseline="text-before-edge">0%</text>

        <text id="memLabel" dominant-baseline="text-before-edge">MEM</text>
        <rect id="memTrack" rx="2" fill="#40FFFFFF" />
        <rect id="memBar" width="0" rx="2" />
        <text id="memText" text-anchor="end" dominant-baseline="text-before-edge">0%</text>

        <text id="pagLabel" dominant-baseline="text-before-edge">PAG</text>
        <rect id="pagTrack" rx="2" fill="#40FFFFFF" />
        <rect id="pagBar" width="0" rx="2" />
        <text id="pagText" text-anchor="end" dominant-baseline="text-before-edge">0%</text>

        <text id="battLabel" dominant-baseline="text-before-edge">BATT</text>
        <rect id="battTrack" rx="2" fill="#40FFFFFF" />
        <rect id="battBar" width="0" rx="2" />
        <text id="battText" text-anchor="end" dominant-baseline="text-before-edge">0%</text>

        <text id="uptime" dominant-baseline="text-before-edge">up —</text>

        <!-- `UpdateText`: Collapsed until the update check finds a newer release, which arrives on the
             `update` channel and is the only thing that unhides this. Already in `THEME_TARGETS`, so it is
             coloured with the rest of the panel and needed no work when the check landed. Empty rather
             than placeholder text: it is `display="none"`, so a placeholder could only ever be seen by
             someone reading this file, and `setText` overwrites it before the element is shown. -->
        <text id="update" dominant-baseline="text-before-edge" display="none"></text>
      </g>
    </svg>
    <script src="renderer.js"></script>
  </body>
</html>
