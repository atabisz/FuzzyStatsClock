# Packaging config for ISC-8 — a real installer size, measured rather than estimated.
#
# The figure in circulation (~85MB) is a prior someone reasoned to, not something anyone
# built. This exists to replace it with a number off disk, comparable to what the WPF
# build actually ships: a 200,457,651-byte single-file exe and a 57,389,487-byte Inno
# installer.
#
# NSIS is chosen for Windows specifically because Inno is what the WPF app uses — a
# user-facing installer with an uninstall entry, not a zip. Comparing a portable archive
# against an installer would flatter this side by measuring a different artefact.
#
# `dist/**` only, plus package.json. There are no production dependencies at all, which
# is why nothing else is listed: the bundles are self-contained by construction
# (`bun build` inlines everything except `electron` itself).

appId: org.tabisz.fuzzyclock
productName: FuzzyClock
copyright: Copyright © 2026 Alex Tabisz

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json
  - "!**/*.map"

# The PowerShell sampler is a probe instrument, not part of the app. Listed as an
# exclusion rather than left implicit, because `scripts/` is not under `dist/` and a
# future change to `files` could otherwise sweep it in without anyone noticing.
extraResources: []

# ~41MB of the 268MB payload was Chromium locale `.pak` files for 55 languages
# (`probe:size` C5 measured it: 55 files, 41M, 15.3% of the payload). Every string this
# app renders is its own SVG text and every tray label is authored in `main/tray.ts`, so
# nothing in the product reads those tables — Chromium falls back to `en-US` for the few
# built-in strings it owns, which is why `en-US` is the one that must stay rather than an
# arbitrary pick.
#
# Two things checked before writing this, because the option is silently ignored when
# either is false:
#   1. THIS version of app-builder-lib honours it on Windows and Linux, not only macOS —
#      `node_modules/app-builder-lib/out/electron/ElectronFramework.js:58-101`, where the
#      non-mac branch globs `locales/*.pak`. Older releases were mac-only, so the option
#      would have been a no-op that read as a saving.
#   2. It logs `no locales found matching wanted languages, skipping cleanup` and keeps
#      everything if the name matches nothing — so a typo here costs 41MB silently. The
#      measured payload after this change is the check, and `probe:size` prints it.
electronLanguages:
  - en-US

win:
  target:
    - nsis
  # `build/icon.ico` is `FuzzyClock.App/app.ico` copied by `scripts/extract-icon.ts` — the
  # shipped product icon, not a placeholder. Named explicitly rather than left to the
  # `buildResources` default so that a missing file is an error here instead of a silent
  # fallback to the stock Electron icon, which is how the P1.5 build came to be measured
  # without one.
  icon: build/icon.ico

nsis:
  # Not one-click: the WPF app's Inno installer asks where to go, and an installer that
  # silently drops the app in %LOCALAPPDATA% is a different product decision, not a
  # packaging detail.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

# ── The two targets that cannot be BUILT on this host ──────────────────────────────
#
# `dmg` needs macOS (hdiutil) and `AppImage` needs Linux tooling; electron-builder refuses
# both from Windows rather than producing something wrong, and `probe:size` says so in its
# closing note. So everything below is CONFIGURED here and packaged elsewhere, and it is
# written out in full anyway because the alternative — discovering the config gaps on a
# borrowed mac — is the expensive order.
#
# That borrowed mac happened on 2026-08-30, so the mac half of this block is no longer a
# plan. `dist:mac` on a macOS 26.6.2 arm64 host exited 0 and produced
# FuzzyClock-5.0.0-alpha.0-arm64.dmg (87,794,076 bytes), and the whole config below was
# validated as written — `LSUIElement`, the category and the appId all read back out of the
# built bundle's Info.plist. `dist:linux` from that same host got as far as
# `linux-arm64-unpacked` and then failed at AppImage assembly with `spawn EBADARCH (86)`:
# electron-builder's downloaded `mksquashfs` is a Linux binary and macOS will not exec it.
# That is a host-tooling limit, not a config gap, and it is the reason `linux` below is still
# waiting on a real Linux host rather than on anything in this file.
#
# One gotcha for whoever runs this next, because it cost half an hour: **`dist:mac` needs a
# real `node` on PATH, not just `bun`.** electron-builder shells out to a bundled
# `icon-tool.js` that drives `vips.wasm`, and under bun-standing-in-for-node (which is what
# `bun run` does when no `node` exists) that child never returns — 28 minutes elapsed for 19
# seconds of CPU, no error, no timeout. It is a hang, not a failure, so it reads like a slow
# build. With real node on PATH the same command finishes in about a minute.
#
# Both now carry `build/icon.png`, and it is a different file from `build/icon.ico`:
#   - The ICO is `FuzzyClock.App/app.ico`, copied by `scripts/extract-icon.ts`. Its largest
#     entry is 256x256 and the format cannot hold more — ICO dimensions are single bytes.
#   - electron-builder's PNG→icns conversion refuses a source below 512x512, so for a long
#     time these two keys were deliberately ABSENT and both targets packaged with the stock
#     Electron icon. Pointing `mac.icon` at the 256 source would not have "skipped the icon",
#     it would have failed the build — and failed `dist:win` with it, since the config is
#     validated as a whole before a target is selected.
#     **The 512 floor is an ICNS constraint only, and the earlier version of this comment was
#     wrong to extend it to Linux.** Measured by calling `convertIcon` on a 256x256 PNG both
#     ways: `format: "icns"` throws `ERR_ICON_TOO_SMALL`, `format: "set"` returns `[256]` at
#     exit 0. So `linux.icon` was never the blocked half — `mac.icon` was, and Linux was
#     simply waiting on the same file.
#   - `scripts/make-icon.ts` removes that constraint by REDRAWING the artwork from recovered
#     geometry instead of upscaling it, at 1024x1024. `bun run probe:icon` holds it to the
#     shipped raster (premultiplied MAE 0.402/255 globally, 1.848 in the worst 16x16 tile)
#     and proves the comparison can fail, via six single-parameter mutations.
#
# The conversions accept it, measured rather than assumed:
#   - macOS: `dist:mac` generated Contents/Resources/icon.icns from this PNG, 174,738 bytes,
#     largest image 1024x1024, and `iconutil -c iconset` extracts a complete ladder — 16, 32,
#     48, 128, 256, 512, 1024 with the @2x variants, eleven images, real pixel dimensions
#     checked one by one rather than trusted from the filenames. Rendered back to PNG through
#     macOS's own decoder and looked at: dark disc, white hub, hands at ten and two.
#   - Linux: `convertIcon({format: "set"})` accepts this file at exit 0 and returns `[1024]` —
#     and "returns" is literal. For a single `.png` source the converter hands the file back
#     AS-IS (`out/util/iconConverter.js`, the branch commented `set: source is already a .png
#     — return as-is with its dimensions`); it generates no size ladder. So what Linux ships
#     is this one 1024x1024 PNG, which is what freedesktop wants, and there is nothing
#     multi-size to inspect. **An earlier version of this comment claimed the converter
#     "emitted all eight sizes (16→512), exit 0". That was wrong and is retracted here rather
#     than quietly deleted** — see the note below about why no build ever produced it.
#   - And the 512 floor above is not folklore. Pointing `mac.icon` at a 256px downsample of
#     this very file fails the build with `Icon must be at least 512x512 pixels, provided:
#     256x256` (app-builder-lib/src/util/iconConverter.ts:307, exit 1) — so the sentence about
#     what would have happened with the 256 source is a measurement now, not a prediction.
#
# **The Linux icon path was measured by calling `convertIcon` directly, NOT by a build, and
# that distinction is the whole reason the retraction above was needed.** A `dist:linux` run
# never reaches the icon step at all: it fails at AppImage assembly (below), and its log
# contains **zero** lines matching `icon` — checked, after `release/.icon-set` turned out not
# to exist on the host that supposedly produced it. A green read off a build that never ran
# the step is the failure mode here, and it took looking for the artefact to catch it.
#
# What is still NOT bought: that a Linux desktop environment draws the result. No AppImage has
# been assembled and no Linux host has displayed the icon.

mac:
  target: dmg
  category: public.app-category.utilities
  icon: build/icon.png
  # The overlay is not a document app and has no dock presence worth keeping; `LSUIElement`
  # is the plist half of what `app.dock.hide()` does at runtime, and setting it here stops
  # the dock icon appearing for the moment between launch and that call.
  extendInfo:
    LSUIElement: true

linux:
  target: AppImage
  category: Utility
  icon: build/icon.png
  # No `desktop:` override. electron-builder derives the launcher entry's `Name` from
  # `productName`, which is the same literal `main/auto-launch.ts` writes into its XDG
  # autostart file — so the two agree without a third place to keep in step. The override
  # was written and then removed: the schema types `linux.desktop.entry` as a *function*
  # (`app-builder-lib/scheme.json`, LinuxDesktopFile), so a plain YAML mapping there is a
  # config-validation failure — and it would fail the `dist:win` run too, since the config
  # is validated as a whole before any target is selected.
